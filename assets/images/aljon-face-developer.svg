<svg width="480" height="640" viewBox="0 0 480 640" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="archBg" x1="240" y1="0" x2="240" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B695C"/>
      <stop offset="0.7" stop-color="#3E4A3F"/>
      <stop offset="1" stop-color="#181816"/>
    </linearGradient>

    <!-- Arch Clip Mask -->
    <clipPath id="archClip">
      <path d="M0 160C0 71.6344 71.6344 0 160 0H320C408.366 0 480 71.6344 480 160V640H0V160Z"/>
    </clipPath>

    <!-- Soft Glow -->
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7A897B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3E4A3F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Arch Frame with Gradient Background -->
  <g clip-path="url(#archClip)">
    <!-- Base Background -->
    <path d="M0 0H480V640H0V0Z" fill="url(#archBg)"/>
    
    <!-- Ambient Tech Glow Circle -->
    <circle cx="240" cy="240" r="220" fill="url(#glow)"/>

    <!-- Developer Grid Lines -->
    <path d="M0 120H480M0 240H480M0 360H480M0 480H480M120 0V640M240 0V640M360 0V640" stroke="#7A897B" stroke-opacity="0.15" stroke-width="1"/>

    <!-- Actual Aljon Face Photo Embedded in Frame -->
    <image href="aljon-face.jpg" x="40" y="30" width="400" height="520" preserveAspectRatio="xMidYMin slice" opacity="0.95"/>

    <!-- 3D Laptop Overlay Base at Bottom of Portrait -->
    <!-- Gradient Overlay for Seamless Integration -->
    <rect x="0" y="380" width="480" height="260" fill="url(#archBg)" opacity="0.75"/>

    <!-- 3D Tech Lines & Code Visuals -->
    <path d="M40 500L240 450L440 500" stroke="#27C93F" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6 4"/>

    <!-- Floating Tech Symbols -->
    <rect x="60" y="440" width="90" height="28" rx="6" fill="#181816" fill-opacity="0.7" stroke="#7A897B" stroke-opacity="0.3"/>
    <text x="105" y="458" fill="#27C93F" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">&lt;code/&gt;</text>

    <rect x="330" y="460" width="90" height="28" rx="6" fill="#181816" fill-opacity="0.7" stroke="#7A897B" stroke-opacity="0.3"/>
    <text x="375" y="478" fill="#61DAFB" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">PHP &amp; JS</text>

    <!-- Badge at Bottom -->
    <rect x="140" y="570" width="200" height="38" rx="19" fill="#181816" fill-opacity="0.8" stroke="rgba(255,255,255,0.2)"/>
    <text x="240" y="594" fill="#F5F4F0" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1">ALJON REYES — DEV</text>
  </g>
</svg>
