<svg width="600" height="520" viewBox="0 0 600 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pBg" x1="300" y1="0" x2="300" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B695C"/>
      <stop offset="1" stop-color="#3E4A3F"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="300" y1="100" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#181816"/>
      <stop offset="1" stop-color="#242422"/>
    </linearGradient>
  </defs>

  <!-- Container Background -->
  <rect width="600" height="520" rx="28" fill="url(#pBg)"/>

  <!-- Grid Lines -->
  <path d="M0 130H600M0 260H600M0 390H600M150 0V520M300 0V520M450 0V520" stroke="#7A897B" stroke-opacity="0.2" stroke-width="1"/>

  <!-- 3D Isometric Laptop Platform Base -->
  <ellipse cx="300" cy="400" rx="220" ry="60" fill="#181816" fill-opacity="0.4"/>
  <ellipse cx="300" cy="395" rx="200" ry="50" fill="#181816" fill-opacity="0.6"/>

  <!-- 3D Laptop Screen Structure -->
  <rect x="140" y="80" width="320" height="210" rx="12" fill="url(#screenGlow)" stroke="#7A897B" stroke-width="3"/>
  <rect x="152" y="94" width="296" height="182" rx="6" fill="#181816"/>

  <!-- Laptop Code IDE Lines -->
  <rect x="152" y="94" width="296" height="24" fill="#242422"/>
  <circle cx="168" cy="106" r="4" fill="#FF5F56"/>
  <circle cx="180" cy="106" r="4" fill="#FFBD2E"/>
  <circle cx="192" cy="106" r="4" fill="#27C93F"/>
  <text x="210" y="110" fill="#7A897B" font-family="monospace" font-size="10" font-weight="bold">SystemProcess.php — Active</text>

  <!-- IDE Code Lines -->
  <text x="170" y="138" fill="#7A897B" font-family="monospace" font-size="11">&lt;?php // Streamlined Pipeline</text>
  <text x="170" y="156" fill="#61DAFB" font-family="monospace" font-size="11">$plan = new PlanAndAnalyze();</text>
  <text x="170" y="174" fill="#F7DF1E" font-family="monospace" font-size="11">$design = new DatabasePrototype();</text>
  <text x="170" y="192" fill="#27C93F" font-family="monospace" font-size="11">$build = $php-&gt;integrateMySQL();</text>
  <text x="170" y="210" fill="#F5F4F0" font-family="monospace" font-size="11">if ($test-&gt;isOptimized()) {</text>
  <text x="190" y="228" fill="#38BDF8" font-family="monospace" font-size="11">return $deploy-&gt;success();</text>
  <text x="170" y="246" fill="#F5F4F0" font-family="monospace" font-size="11">}</text>

  <!-- 3D Laptop Keyboard Base -->
  <path d="M100 290L140 290L460 290L500 290L450 360H150L100 290Z" fill="#242422" stroke="#7A897B" stroke-width="2"/>
  <polygon points="145,296 455,296 445,348 155,348" fill="#181816"/>
  
  <!-- Trackpad -->
  <polygon points="260,325 340,325 336,345 264,345" fill="#2D2D2A"/>

  <!-- Orbiting Node Rings (Representing Development Lifecycle) -->
  <ellipse cx="300" cy="270" rx="240" ry="80" stroke="#27C93F" stroke-width="1.5" stroke-dasharray="8 6" stroke-opacity="0.6"/>

  <!-- Orbit Nodes -->
  <circle cx="80" cy="270" r="18" fill="#181816" stroke="#27C93F" stroke-width="2"/>
  <text x="80" y="274" fill="#27C93F" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">01</text>

  <circle cx="300" cy="190" r="18" fill="#181816" stroke="#61DAFB" stroke-width="2"/>
  <text x="300" y="194" fill="#61DAFB" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">02</text>

  <circle cx="520" cy="270" r="18" fill="#181816" stroke="#F7DF1E" stroke-width="2"/>
  <text x="520" y="274" fill="#F7DF1E" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">03</text>

  <circle cx="300" cy="350" r="18" fill="#181816" stroke="#38BDF8" stroke-width="2"/>
  <text x="300" y="354" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">04</text>
</svg>
